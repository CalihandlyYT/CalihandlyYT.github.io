# Публикация сайта-визитки на GitHub Pages.
# Выкладываются только статические файлы — админка и сервер работают локально.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect static files
        run: |
          mkdir _site
          cp index.html style.css script.js effects.js data.js projects.js _site/
          if [ -f og.png ]; then cp og.png _site/; fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
